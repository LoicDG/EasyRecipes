# Builds an installable Android APK every time something lands on master
# (a merged pull request is a push to master) and publishes it as a GitHub
# Release, so the newest build can be downloaded straight onto the phone.
#
# The build runs on the runner with Gradle rather than on EAS: no Expo account
# token, no build queue, no monthly build quota. /android is generated by
# `expo prebuild` on every run and never committed.

name: Android build

on:
  push:
    branches: [master]
  workflow_dispatch:

# A newer merge makes an in-flight build pointless.
concurrency:
  group: android-build
  cancel-in-progress: true

permissions:
  contents: write # create the release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same checks CLAUDE.md asks for before every change; a broken tree
      # should fail here in a minute rather than after a long native build.
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install --clean

      # Prebuild writes app.json's versionCode (1) straight into build.gradle,
      # and there is no Gradle property to override it. Following the run
      # number means Android always treats a newer build as an update.
      - name: Set versionCode
        run: |
          sed -i -E 's/^( *versionCode) [0-9]+$/\1 ${{ github.run_number }}/' android/app/build.gradle
          grep -q "versionCode ${{ github.run_number }}$" android/app/build.gradle

      - uses: gradle/actions/setup-gradle@v4

      # Release builds are signed with the debug keystore that prebuild's
      # template ships. It is the same key on every run, so each APK installs
      # over the previous one. It is not a Play Store key — sideloading only.
      #
      # Only arm64-v8a is built: it covers every current phone and cuts the
      # native compile to a quarter.
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Name the APK
        id: apk
        run: |
          name="EasyRecipes-${{ github.run_number }}-${GITHUB_SHA::7}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "${{ steps.apk.outputs.name }}" \
            --target "$GITHUB_SHA" \
            --title "Build ${{ github.run_number }}" \
            --notes "Built from ${GITHUB_SHA::7}: $(git log -1 --format=%s)" \
            --latest
